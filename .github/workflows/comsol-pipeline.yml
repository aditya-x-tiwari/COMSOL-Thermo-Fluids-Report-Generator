# Paste a COMSOL export's Google Drive link when running this manually.
# It downloads the file onto the runner, processes every solution inside
# it (e.g. all 12 Ri/Re combos in a Case file), and uploads the resulting
# zips as one downloadable artifact. The large data file itself never
# touches git - it's discarded when the runner shuts down.

name: comsol-pipeline

on:
  workflow_dispatch:
    inputs:
      data_ref:
        description: "Google Drive URL/ID (or local test path) of the COMSOL export"
        required: true
      case_name:
        description: "Base case name (e.g. Case1) - each Ri/Re combo inside gets its own zip"
        required: false
        default: "Case"

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run pipeline (heatlines off - see README caveat)
        run: |
          python pipeline.py \
            --input "${{ inputs.data_ref }}" \
            --case-name "${{ inputs.case_name }}" \
            --no-heatlines

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.case_name }}-plots
          path: artifacts/*.zip
          retention-days: 30

      - name: Build Word report from all zips
        run: python report.py --artifacts-dir artifacts --output output/validation_report.docx

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.case_name }}-report
          path: output/validation_report.docx
          retention-days: 30
